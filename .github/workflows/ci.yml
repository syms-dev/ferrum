name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      # Deliberately not `nix flake check`: that also pulls in the
      # KVM-dependent smoke-vm check (see tests/smoke.nix), which belongs in
      # vm-tests.yml's job instead so this one stays fast and so a VM-test
      # failure can't be conflated with an eval failure. Building these
      # three directly evaluates the same flake metadata as a side effect,
      # so a separate `nix flake check --no-build` pass would only repeat
      # that evaluation (NixOS module evaluation is not free) for no extra
      # coverage -- the first CI run measured this costing several minutes.
      #
      # eval-example-hosts is deliberately NOT in this list, even though it
      # once was: once the example host declares any sops.secrets (Phase
      # 1.4a onward), forcing its .drvPath requires realizing
      # sops-install-secrets and the host's full app closures, confirmed on
      # real infrastructure to cost well beyond what a standard
      # GitHub-hosted runner's disk reliably holds (see the comment on
      # `eval-example-hosts` in nix/modules/flake/checks.nix for the real
      # numbers). sopsfile-are-paths below is the cheap, CI-safe regression
      # guard for the specific bug that check exists to catch in this
      # phase; eval-example-hosts itself is still defined and runnable by
      # hand for anyone touching modules/apps/ or modules/core/secrets.nix.
      - name: cheap checks
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.catalog-consistency \
            .#checks.x86_64-linux.schema-uniformity \
            .#checks.x86_64-linux.sopsfile-are-paths

  # The Rust workspace: ~5,200 lines across four crates and 118 unit tests
  # which, until 2026-09-15, CI never ran even once. The eval checks above
  # do not build the Rust packages, and the VM tests (vm-tests.yml) had
  # never completed, so nothing in CI had ever compiled this code.
  #
  # Building the four packages is what runs the tests: each is a
  # rustPlatform.buildRustPackage whose checkPhase runs `cargo test`, with
  # the real runtime tools (btrfs-progs, sops, ssh-to-age, authelia) supplied
  # via nativeCheckInputs. That matters -- preflight::check_is_subvolume
  # shells out to `btrfs`, and without it on PATH that test fails for an
  # environment reason rather than a real one.
  #
  # Going through Nix rather than a separate rustup toolchain also means CI
  # tests the exact compiler and dependency closure the real host builds
  # with, instead of a second toolchain that could drift from it.
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: build and test the Rust workspace
        run: |
          nix build --print-build-logs \
            .#ferrum-apply \
            .#ferrumd \
            .#ferrum-reconcile \
            .#ferrum-testapp \
            .#checks.x86_64-linux.workspace-tests
