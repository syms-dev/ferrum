[package]
name = "ferrum-install"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ferrum-install"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
