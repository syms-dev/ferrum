[package]
name = "ferrumd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ferrumd"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom", "std"] }
tower-cookies = "0.10"
ferrum-secrets = { path = "../ferrum-secrets" }
jsonschema = "0.18"
# The privilege boundary's client half (src/dbus.rs). default-features =
# false + the tokio feature keeps zbus off its own async-io/async-executor
# stack, so it shares ferrumd's existing tokio runtime instead of spinning
# up a second one.
zbus = { version = "4", default-features = false, features = ["tokio"] }
uuid = { version = "1", features = ["v4"] }
async-stream = "0.3"
# Only for StreamExt on zbus's JobRemoved signal stream in main.rs.
futures = "0.3"

[dev-dependencies]
tempfile = "3"
# Only for `ServiceExt::oneshot` in main.rs's CSRF tests, which drive real
# requests through the real axum router + require_session middleware rather
# than calling the predicates in isolation. 0.5 is the line axum 0.7.9
# itself already resolves to (checked against the real Cargo.lock: a "0.4"
# pin here really did add a SECOND tower to the tree), so this pulls in no
# new dependency at all.
tower = { version = "0.5", features = ["util"] }
